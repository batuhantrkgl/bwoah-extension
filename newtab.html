<!DOCTYPE html>
<html>

<head>
  <title>New Tab with Bwoah Extension</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
  </style>
  <link rel="stylesheet" href="styles.css"> <!-- Use the correct path here -->
</head>

<body>
  <div id="image-container">
    <img src="" alt="Background Image">
  </div>
  <div id="overlay">
    <div class="center-container">
        <div id="random-word">Loading word...</div>
    </div>
  </div>
  <div id="drivers-leaderboard" style="display: none;">
    <h2>Drivers Leaderboard</h2>
    <div id="drivers-list"></div>
  </div>
  <div id="teams-leaderboard" style="display: none;">
    <h2>Teams Leaderboard</h2>
    <div id="teams-list"></div>
  </div>
  <div id="race-schedule">
    <div id="toggle-buttons">
      <button id="f1-button" class="toggle-button">
        <img src="images/f1.svg" alt="F1 Website">
      </button>
      <button id="track-button" class="toggle-button">
        <img src="images/flag.png" alt="Track Details">
      </button>
      <button id="schedule-button" class="toggle-button">
        <img src="images/schedule.png" alt="Schedule Details">
      </button>
      <button id="news-button" class="toggle-button">
        <img src="images/news.png" alt="News from F1">
      </button>
      <button id="others-button" class="toggle-button">
        <img src="images/others.png" alt="Other Stuff">
      </button>
    </div>
    <div id="others-container" style="display: none">
      <button id="donate-button" class="others-button">
        <img src="images/donate.png" alt="Donate">
      </button>
      <button id="github-button" class="others-button">
        <img src="images/github.png" alt="GitHub">
      </button>
      <button id="discord-button" class="others-button">
        <img src="images/discord.svg" alt="Discord">
      </button>
      <button id="blur-button" class="others-button">
        <img src="images/blur_on.png" alt="Blur Button">
      </button>
      <button id="darkness-button" class="others-button">
        <img src="images/darkness.png" alt="Darkness Button">
      </button>
      <button id="standings-button" class="others-button">
        <img src="images/standings.png" alt="Show Standings">
      </button>
      <button id="back-button" class="others-button">
        <img src="images/back.png" alt="Back Button">
      </button>
    </div>
  </div>
  <script src="newtab.js"></script>
</body>

</html>
